<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forest Within</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020202;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.72);
      font-size: clamp(15px, 1.35vw, 21px);
      letter-spacing: 0;
      background: #020202;
      z-index: 2;
      transition: opacity 420ms ease, visibility 420ms ease;
    }

    #loading.is-hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <canvas id="scene" tabindex="0" autofocus aria-label="Forest projection mapped onto the room screen"></canvas>
  <div id="loading">Loading forest...</div>

  <script src="assets/vendor/embedded-assets.js"></script>
  <script>
    (() => {
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");
      const loadingEl = document.getElementById("loading");
      canvas.tabIndex = 0;
      document.body.tabIndex = -1;

      const projectionCanvas = document.createElement("canvas");
      const projectionCtx = projectionCanvas.getContext("2d");
      const revealMaskCanvas = document.createElement("canvas");
      const revealMaskCtx = revealMaskCanvas.getContext("2d");
      const colorLayerCanvas = document.createElement("canvas");
      const colorLayerCtx = colorLayerCanvas.getContext("2d");

      const ROOM_WIDTH = 1672;
      const ROOM_HEIGHT = 941;
      const PROJECTION_WIDTH = 1800;
      const PROJECTION_HEIGHT = 900;
      const CURVE_LEFT = -82;
      const CURVE_RIGHT = 1754;

      const images = {};
      const canopyLightBands = createCanopyLightBands();
      const fogSheets = createFogSheets();
      const waterStreaks = createWaterStreaks();
      const permanentGlows = [];
      const doorZones = [
        { x: 0.205, y: 0.555, rx: 0.075, ry: 0.12 },
        { x: 0.431, y: 0.555, rx: 0.07, ry: 0.12 },
        { x: 0.787, y: 0.555, rx: 0.075, ry: 0.12 }
      ];
      const pointer = {
        x: PROJECTION_WIDTH * 0.5,
        y: PROJECTION_HEIGHT * 0.55,
        active: false
      };
      const butterfly = createButterfly(PROJECTION_WIDTH * 0.52, PROJECTION_HEIGHT * 0.55);
      const blueState = createButterflyState();

      let width = 0;
      let height = 0;
      let dpr = 1;
      let baseRoomRect = { x: 0, y: 0, w: 0, h: 0 };
      let roomRect = { x: 0, y: 0, w: 0, h: 0 };
      let forestRect = { x: 0, y: 0, w: PROJECTION_WIDTH, h: PROJECTION_HEIGHT };
      let previousTime = performance.now();
      const pressedKeys = new Set();
      const viewer = {
        depth: 0,
        targetDepth: 0,
        pan: 0,
        targetPan: 0,
        lift: 0,
        targetLift: 0
      };

      Promise.all([
        loadImage("assets/room.png"),
        loadImage(window.FOREST_WITHIN_EMBEDDED_ASSETS.bg || "assets/forest-bg.png"),
        loadImage(window.FOREST_WITHIN_EMBEDDED_ASSETS.color || "assets/forest-color.png"),
        loadImage("assets/thinking-of-someone-butterfly.svg")
      ]).then(([room, forest, colorForest, blueButterfly]) => {
        images.room = room;
        images.forest = forest;
        images.colorForest = colorForest;
        images.blueButterfly = blueButterfly;
        resize();
        loadingEl.classList.add("is-hidden");
        focusScene();
        requestAnimationFrame(render);
      });

      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", updatePointer, { passive: true });
      window.addEventListener("pointerdown", focusScene, { passive: true });
      window.addEventListener("touchmove", updateTouch, { passive: false });
      window.addEventListener("touchstart", updateTouch, { passive: false });
      document.addEventListener("keydown", handleKeyDown, true);
      document.addEventListener("keyup", handleKeyUp, true);
      window.addEventListener("focus", focusScene);
      window.addEventListener("blur", () => pressedKeys.clear());

      function resize() {
        if (!images.room || !images.forest) return;

        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        projectionCanvas.width = PROJECTION_WIDTH;
        projectionCanvas.height = PROJECTION_HEIGHT;
        revealMaskCanvas.width = PROJECTION_WIDTH;
        revealMaskCanvas.height = PROJECTION_HEIGHT;
        colorLayerCanvas.width = PROJECTION_WIDTH;
        colorLayerCanvas.height = PROJECTION_HEIGHT;
        projectionCtx.imageSmoothingEnabled = true;
        projectionCtx.imageSmoothingQuality = "high";
        colorLayerCtx.imageSmoothingEnabled = true;
        colorLayerCtx.imageSmoothingQuality = "high";

        baseRoomRect = getCoverRect(images.room, width, height);
        updateRoomRect(0);
        forestRect = getContainRect(images.forest, PROJECTION_WIDTH, PROJECTION_HEIGHT);
      }

      function render(time) {
        const dt = Math.min((time - previousTime) / 1000, 0.05);
        previousTime = time;
        const seconds = time * 0.001;

        updateViewerControls(dt);
        updateButterflies(dt);
        drawProjection(seconds, dt);
        drawRoomComposite(seconds);

        requestAnimationFrame(render);
      }

      function createButterfly(x, y) {
        return {
          x,
          y,
          lastX: x,
          lastY: y,
          angle: 0,
          opacity: 1,
          scale: 1
        };
      }

      function createButterflyState() {
        return {
          mode: "follow",
          hoverDoor: null,
          hoverSeconds: 0,
          flight: null
        };
      }

      function updateViewerControls(dt) {
        const moveSpeed = 1.7;
        const panSpeed = 1.9;

        if (pressedKeys.has("ArrowUp")) {
          viewer.targetDepth += moveSpeed * dt;
        }
        if (pressedKeys.has("ArrowDown")) {
          viewer.targetDepth -= moveSpeed * dt;
        }
        if (pressedKeys.has("ArrowLeft")) {
          viewer.targetPan -= panSpeed * dt;
        }
        if (pressedKeys.has("ArrowRight")) {
          viewer.targetPan += panSpeed * dt;
        }

        viewer.targetDepth = clamp(viewer.targetDepth, -0.55, 2.15);
        viewer.targetPan = clamp(viewer.targetPan, -1.25, 1.25);
        viewer.targetLift = viewer.targetDepth * 0.18;

        const ease = 1 - Math.exp(-dt * 5.2);
        viewer.depth += (viewer.targetDepth - viewer.depth) * ease;
        viewer.pan += (viewer.targetPan - viewer.pan) * ease;
        viewer.lift += (viewer.targetLift - viewer.lift) * ease;
        updateRoomRect(dt);
      }

      function updateRoomRect() {
        const zoom = 1 + viewer.depth * 0.43;
        const shiftX = -viewer.pan * baseRoomRect.w * 0.18;
        const shiftY = viewer.lift * baseRoomRect.h * 0.1;
        roomRect = {
          x: baseRoomRect.x - (baseRoomRect.w * zoom - baseRoomRect.w) * 0.5 + shiftX,
          y: baseRoomRect.y - (baseRoomRect.h * zoom - baseRoomRect.h) * 0.42 + shiftY,
          w: baseRoomRect.w * zoom,
          h: baseRoomRect.h * zoom
        };
      }

      function handleKeyDown(event) {
        const key = getArrowKey(event);
        if (!key) return;
        nudgeViewer(key);
        pressedKeys.add(key);
        event.preventDefault();
      }

      function handleKeyUp(event) {
        const key = getArrowKey(event);
        if (!key) return;
        pressedKeys.delete(key);
        event.preventDefault();
      }

      function getArrowKey(event) {
        const key = event.key || event.code;
        const code = event.code || event.key;
        if (key === "ArrowUp" || code === "ArrowUp") return "ArrowUp";
        if (key === "ArrowDown" || code === "ArrowDown") return "ArrowDown";
        if (key === "ArrowLeft" || code === "ArrowLeft") return "ArrowLeft";
        if (key === "ArrowRight" || code === "ArrowRight") return "ArrowRight";
        return "";
      }

      function nudgeViewer(key) {
        const depthStep = 0.18;
        const panStep = 0.15;

        if (key === "ArrowUp") viewer.targetDepth += depthStep;
        if (key === "ArrowDown") viewer.targetDepth -= depthStep;
        if (key === "ArrowLeft") viewer.targetPan -= panStep;
        if (key === "ArrowRight") viewer.targetPan += panStep;
      }

      function focusScene() {
        canvas.focus({ preventScroll: true });
      }

      function updateButterflies(dt) {
        moveBlueButterfly(dt);
      }

      function moveBlueButterfly(dt) {
        butterfly.lastX = butterfly.x;
        butterfly.lastY = butterfly.y;

        if (blueState.mode !== "follow") {
          updateFlight(butterfly, blueState, dt);
          updateButterflyAngle(butterfly);
          revealButterflyPath(butterfly);
          return;
        }

        const follow = 1 - Math.exp(-dt * 8.5);
        butterfly.x += (pointer.x - butterfly.x) * follow;
        butterfly.y += (pointer.y - butterfly.y) * follow;
        butterfly.opacity = 1;
        butterfly.scale = 1;
        updateDoorHover(butterfly, blueState, dt);
        updateButterflyAngle(butterfly);
        revealButterflyPath(butterfly);
      }

      function updateButterflyAngle(target) {
        const dx = target.x - target.lastX;
        const dy = target.y - target.lastY;
        if (Math.hypot(dx, dy) > 0.2) {
          target.angle = Math.atan2(dy, dx) * 180 / Math.PI;
        }
      }

      function updateDoorHover(target, state, dt) {
        const door = getCurrentDoor(target);

        if (!door) {
          state.hoverDoor = null;
          state.hoverSeconds = 0;
          return;
        }

        if (door !== state.hoverDoor) {
          state.hoverDoor = door;
          state.hoverSeconds = 0;
        }

        state.hoverSeconds += dt;
        if (state.hoverSeconds >= 5) {
          beginEnteringCabin(target, state, door);
        }
      }

      function updateFlight(target, state, dt) {
        const flight = state.flight;
        if (!flight) return;

        flight.elapsed += dt;
        const t = clamp(flight.elapsed / flight.duration, 0, 1);
        const eased = easeInOutCubic(t);

        target.x = cubicBezier(flight.from.x, flight.controlA.x, flight.controlB.x, flight.to.x, eased);
        target.y = cubicBezier(flight.from.y, flight.controlA.y, flight.controlB.y, flight.to.y, eased);
        target.opacity = lerp(flight.fromOpacity, flight.toOpacity, flight.opacityEase(t));
        target.scale = lerp(flight.fromScale, flight.toScale, flight.scaleEase(t));

        if (state.mode === "autoFlying" && t > 0.7) {
          drawLandingBloom(flight.to.x, flight.to.y);
        }

        if (t < 1) return;

        if (state.mode === "entering") {
          beginInsideWait(target, state, flight.door);
          return;
        }

        if (state.mode === "autoFlying") {
          beginVanishing(target, state, flight.to);
          return;
        }

        if (state.mode === "vanishing") {
          state.mode = "hidden";
          state.flight = null;
        }
      }

      function beginEnteringCabin(target, state, door) {
        const doorCenter = getDoorCenter(door);
        state.mode = "entering";
        state.hoverDoor = null;
        state.hoverSeconds = 0;
        state.flight = {
          door,
          elapsed: 0,
          duration: 1.45,
          from: { x: target.x, y: target.y },
          controlA: { x: target.x, y: target.y - PROJECTION_HEIGHT * 0.048 },
          controlB: { x: doorCenter.x, y: doorCenter.y - PROJECTION_HEIGHT * 0.03 },
          to: doorCenter,
          fromOpacity: target.opacity,
          toOpacity: 0,
          fromScale: target.scale,
          toScale: 0.12,
          opacityEase: easeInCubic,
          scaleEase: easeInCubic
        };
      }

      function beginInsideWait(target, state, door) {
        state.mode = "inside";
        state.flight = null;
        window.setTimeout(() => {
          if (state.mode === "inside") {
            beginAutoFlight(target, state, door);
          }
        }, 10000);
      }

      function beginAutoFlight(target, state, door) {
        const start = getDoorCenter(door);
        const destination = getRandomLandingPoint();

        target.x = start.x;
        target.y = start.y;
        target.lastX = start.x;
        target.lastY = start.y;
        state.mode = "autoFlying";
        state.flight = {
          elapsed: 0,
          duration: 4.2,
          from: start,
          controlA: {
            x: lerp(start.x, destination.x, 0.28),
            y: Math.min(start.y, destination.y) - PROJECTION_HEIGHT * 0.24
          },
          controlB: {
            x: lerp(start.x, destination.x, 0.72),
            y: Math.min(start.y, destination.y) - PROJECTION_HEIGHT * 0.18
          },
          to: destination,
          fromOpacity: 0,
          toOpacity: 1,
          fromScale: 0.18,
          toScale: 1,
          opacityEase: easeOutCubic,
          scaleEase: easeOutCubic
        };
      }

      function beginVanishing(target, state, point) {
        addPermanentReveal(point.x, point.y);
        state.mode = "vanishing";
        state.flight = {
          elapsed: 0,
          duration: 3.2,
          from: { x: target.x, y: target.y },
          controlA: { x: target.x + PROJECTION_WIDTH * 0.05, y: target.y - PROJECTION_HEIGHT * 0.08 },
          controlB: { x: target.x - PROJECTION_WIDTH * 0.02, y: target.y - PROJECTION_HEIGHT * 0.13 },
          to: { x: target.x, y: target.y - PROJECTION_HEIGHT * 0.18 },
          fromOpacity: 1,
          toOpacity: 0,
          fromScale: 1,
          toScale: 0.35,
          opacityEase: easeInCubic,
          scaleEase: easeInCubic
        };
      }

      function drawRoomComposite(seconds) {
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(images.room, roomRect.x, roomRect.y, roomRect.w, roomRect.h);

        ctx.save();
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        drawProjectionToCurvedScreen();
        ctx.restore();

        drawProjectionBlend(seconds);
        drawRoomVignette();
      }

      function drawProjectionBlend(seconds) {
        ctx.save();
        clipWallSurfaces();
        ctx.globalCompositeOperation = "multiply";
        const topShadow = ctx.createLinearGradient(0, roomRect.y, 0, roomRect.y + roomRect.h * 0.38);
        topShadow.addColorStop(0, "rgba(0, 0, 0, 0.32)");
        topShadow.addColorStop(1, "rgba(255, 255, 255, 1)");
        ctx.fillStyle = topShadow;
        ctx.fillRect(roomRect.x, roomRect.y, roomRect.w, roomRect.h);
        ctx.restore();
      }

      function drawRoomVignette() {
        ctx.save();
        const vignette = ctx.createRadialGradient(
          width * 0.5,
          height * 0.48,
          Math.min(width, height) * 0.18,
          width * 0.5,
          height * 0.5,
          Math.max(width, height) * 0.68
        );
        vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
        vignette.addColorStop(0.74, "rgba(0, 0, 0, 0.08)");
        vignette.addColorStop(1, "rgba(0, 0, 0, 0.34)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, width, height);
        ctx.restore();
      }

      function clipWallSurfaces() {
        ctx.beginPath();
        const steps = 96;
        for (let i = 0; i <= steps; i += 1) {
          const t = i / steps;
          const point = mapRoomPoint(getCurvedScreenPoint(t, 0));
          if (i === 0) ctx.moveTo(point.x, point.y);
          else ctx.lineTo(point.x, point.y);
        }
        for (let i = steps; i >= 0; i -= 1) {
          const point = mapRoomPoint(getCurvedScreenPoint(i / steps, 1));
          ctx.lineTo(point.x, point.y);
        }
        ctx.closePath();
        ctx.clip();
      }

      function mapRoomPoint(point) {
        return {
          x: roomRect.x + (point.x / ROOM_WIDTH) * roomRect.w,
          y: roomRect.y + (point.y / ROOM_HEIGHT) * roomRect.h
        };
      }

      function drawProjectionToCurvedScreen() {
        const source = { x: 0, y: 0, w: PROJECTION_WIDTH, h: PROJECTION_HEIGHT };
        const sliceCount = 420;
        const bleed = 0.65 / sliceCount;

        for (let i = 0; i < sliceCount; i += 1) {
          const t0 = Math.max(0, i / sliceCount - bleed);
          const t1 = Math.min(1, (i + 1) / sliceCount + bleed);
          const topA = mapRoomPoint(getCurvedScreenPoint(t0, 0));
          const topB = mapRoomPoint(getCurvedScreenPoint(t1, 0));
          const bottomA = mapRoomPoint(getCurvedScreenPoint(t0, 1));
          const bottomB = mapRoomPoint(getCurvedScreenPoint(t1, 1));
          const sx = source.x + source.w * t0;
          const sw = source.w * (t1 - t0);

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(topA.x, topA.y);
          ctx.lineTo(topB.x, topB.y);
          ctx.lineTo(bottomB.x, bottomB.y);
          ctx.lineTo(bottomA.x, bottomA.y);
          ctx.closePath();
          ctx.clip();

          const a = (topB.x - topA.x) / sw;
          const b = (topB.y - topA.y) / sw;
          const c = (bottomA.x - topA.x) / source.h;
          const d = (bottomA.y - topA.y) / source.h;
          ctx.setTransform(a * dpr, b * dpr, c * dpr, d * dpr, topA.x * dpr, topA.y * dpr);
          ctx.drawImage(projectionCanvas, sx, source.y, sw, source.h, 0, 0, sw, source.h);
          ctx.restore();
        }
      }

      function getCurvedScreenPoint(t, v) {
        const x = lerp(CURVE_LEFT, CURVE_RIGHT, t);
        const edge = Math.abs(t - 0.5) * 2;
        const top = 292 - Math.pow(edge, 1.62) * 308;
        const bottom = 636 + Math.pow(edge, 1.38) * 132;
        return {
          x,
          y: lerp(top, bottom, v)
        };
      }

      function drawImageToQuad(targetCtx, image, source, quad, steps) {
        const [topLeft, topRight, bottomRight, bottomLeft] = quad;
        const sliceCount = Math.max(240, steps * 2);
        const bleed = 0.7 / sliceCount;

        for (let i = 0; i < sliceCount; i += 1) {
          const t0 = Math.max(0, i / sliceCount - bleed);
          const t1 = Math.min(1, (i + 1) / sliceCount + bleed);
          const topA = lerpPoint(topLeft, topRight, t0);
          const topB = lerpPoint(topLeft, topRight, t1);
          const bottomA = lerpPoint(bottomLeft, bottomRight, t0);
          const bottomB = lerpPoint(bottomLeft, bottomRight, t1);
          const sx = source.x + source.w * t0;
          const sw = source.w * (t1 - t0);

          targetCtx.save();
          targetCtx.beginPath();
          targetCtx.moveTo(topA.x, topA.y);
          targetCtx.lineTo(topB.x, topB.y);
          targetCtx.lineTo(bottomB.x, bottomB.y);
          targetCtx.lineTo(bottomA.x, bottomA.y);
          targetCtx.closePath();
          targetCtx.clip();

          const a = (topB.x - topA.x) / sw;
          const b = (topB.y - topA.y) / sw;
          const c = (bottomA.x - topA.x) / source.h;
          const d = (bottomA.y - topA.y) / source.h;
          targetCtx.setTransform(a * dpr, b * dpr, c * dpr, d * dpr, topA.x * dpr, topA.y * dpr);
          targetCtx.drawImage(image, sx, source.y, sw, source.h, 0, 0, sw, source.h);
          targetCtx.restore();
        }
      }

      function updatePointer(event) {
        const point = getProjectionPointFromClient(event.clientX, event.clientY);
        pointer.x = point.x;
        pointer.y = point.y;
        pointer.active = true;
      }

      function updateTouch(event) {
        event.preventDefault();
        if (!event.touches.length) return;

        const touch = event.touches[0];
        const point = getProjectionPointFromClient(touch.clientX, touch.clientY);
        pointer.x = point.x;
        pointer.y = point.y;
        pointer.active = true;
      }

      function getProjectionPointFromClient(clientX, clientY) {
        const roomPoint = {
          x: ((clientX - roomRect.x) / Math.max(1, roomRect.w)) * ROOM_WIDTH,
          y: ((clientY - roomRect.y) / Math.max(1, roomRect.h)) * ROOM_HEIGHT
        };
        const u = clamp((roomPoint.x - CURVE_LEFT) / (CURVE_RIGHT - CURVE_LEFT), 0, 1);
        const top = getCurvedScreenPoint(u, 0);
        const bottom = getCurvedScreenPoint(u, 1);
        const v = clamp((roomPoint.y - top.y) / Math.max(1, bottom.y - top.y), 0, 1);

        return {
          x: u * PROJECTION_WIDTH,
          y: v * PROJECTION_HEIGHT
        };
      }

      function invertQuadPoint(point, quad) {
        if (!pointInQuad(point, quad)) return null;

        let u = 0.5;
        let v = 0.5;
        for (let i = 0; i < 10; i += 1) {
          const q = bilinearPoint(quad, u, v);
          const du = bilinearDu(quad, v);
          const dv = bilinearDv(quad, u);
          const ex = q.x - point.x;
          const ey = q.y - point.y;
          const det = du.x * dv.y - du.y * dv.x;
          if (Math.abs(det) < 0.0001) break;

          const stepU = (ex * dv.y - ey * dv.x) / det;
          const stepV = (du.x * ey - du.y * ex) / det;
          u = clamp(u - stepU, 0, 1);
          v = clamp(v - stepV, 0, 1);
        }

        return { u, v };
      }

      function pointInQuad(point, quad) {
        let inside = false;
        for (let i = 0, j = quad.length - 1; i < quad.length; j = i, i += 1) {
          const a = quad[i];
          const b = quad[j];
          const crosses = (a.y > point.y) !== (b.y > point.y);
          if (crosses && point.x < ((b.x - a.x) * (point.y - a.y)) / (b.y - a.y) + a.x) {
            inside = !inside;
          }
        }
        return inside;
      }

      function bilinearPoint(quad, u, v) {
        const top = lerpPoint(quad[0], quad[1], u);
        const bottom = lerpPoint(quad[3], quad[2], u);
        return lerpPoint(top, bottom, v);
      }

      function bilinearDu(quad, v) {
        return {
          x: lerp(quad[1].x - quad[0].x, quad[2].x - quad[3].x, v),
          y: lerp(quad[1].y - quad[0].y, quad[2].y - quad[3].y, v)
        };
      }

      function bilinearDv(quad, u) {
        return {
          x: lerp(quad[3].x - quad[0].x, quad[2].x - quad[1].x, u),
          y: lerp(quad[3].y - quad[0].y, quad[2].y - quad[1].y, u)
        };
      }

      function drawProjection(seconds) {
        projectionCtx.clearRect(0, 0, PROJECTION_WIDTH, PROJECTION_HEIGHT);
        drawContinuousForest(seconds);
        drawColorRevealLayer();

        drawForestLightFlow(seconds);
        drawCabinWarmth(seconds);
        drawAtmosphericFog(seconds);
        drawWaterShimmer(seconds);
        drawProjectorFalloff(seconds);
        drawButterflyLayer(seconds);
      }

      function drawContinuousForest(seconds) {
        const image = images.forest;

        projectionCtx.save();
        projectionCtx.filter = "blur(22px) saturate(1.08) brightness(0.92)";
        projectionCtx.globalAlpha = 0.96;
        projectionCtx.drawImage(
          image,
          -PROJECTION_WIDTH * 0.035,
          -PROJECTION_HEIGHT * 0.05,
          PROJECTION_WIDTH * 1.07,
          PROJECTION_HEIGHT * 1.1
        );
        projectionCtx.restore();

        projectionCtx.drawImage(
          image,
          forestRect.x,
          forestRect.y,
          forestRect.w,
          forestRect.h
        );
      }

      function drawColorRevealLayer() {
        if (!images.colorForest) return;

        colorLayerCtx.clearRect(0, 0, PROJECTION_WIDTH, PROJECTION_HEIGHT);
        colorLayerCtx.save();
        colorLayerCtx.filter = "blur(22px) saturate(1.28) contrast(1.08) brightness(1.02)";
        colorLayerCtx.globalAlpha = 0.96;
        colorLayerCtx.drawImage(
          images.colorForest,
          -PROJECTION_WIDTH * 0.035,
          -PROJECTION_HEIGHT * 0.05,
          PROJECTION_WIDTH * 1.07,
          PROJECTION_HEIGHT * 1.1
        );
        colorLayerCtx.restore();

        colorLayerCtx.save();
        colorLayerCtx.filter = "saturate(1.48) contrast(1.18) brightness(1.04)";
        colorLayerCtx.drawImage(
          images.colorForest,
          forestRect.x,
          forestRect.y,
          forestRect.w,
          forestRect.h
        );
        colorLayerCtx.restore();

        colorLayerCtx.globalCompositeOperation = "destination-in";
        colorLayerCtx.drawImage(revealMaskCanvas, 0, 0);
        colorLayerCtx.globalCompositeOperation = "source-over";

        projectionCtx.save();
        projectionCtx.globalCompositeOperation = "screen";
        projectionCtx.globalAlpha = 0.92;
        projectionCtx.drawImage(colorLayerCanvas, 0, 0);
        projectionCtx.restore();
      }

      function drawButterflyLayer(seconds) {
        drawPermanentGlows();
        drawButterflyTrail(butterfly, "rgba(102, 210, 255, 0.28)");
        drawButterflySprite(images.blueButterfly, butterfly, {
          glow: "rgba(102, 210, 255, 0.86)",
          core: "rgba(118, 226, 255, 0.92)"
        }, seconds);
      }

      function drawButterflyTrail(target, color) {
        if (target.opacity <= 0) return;
        const distance = Math.hypot(target.x - target.lastX, target.y - target.lastY);
        if (distance < 0.5) return;

        projectionCtx.save();
        projectionCtx.globalCompositeOperation = "screen";
        projectionCtx.strokeStyle = color;
        projectionCtx.lineWidth = getButterflyProjectionSize() * 0.2;
        projectionCtx.lineCap = "round";
        projectionCtx.beginPath();
        projectionCtx.moveTo(target.lastX, target.lastY);
        projectionCtx.lineTo(target.x, target.y);
        projectionCtx.stroke();
        projectionCtx.restore();
      }

      function drawButterflySprite(image, target, colors, seconds) {
        if (target.opacity <= 0) return;

        const size = getButterflyProjectionSize() * target.scale;
        const sway = Math.sin(seconds * 6) * 5;
        const tilt = clamp(target.angle * 0.08, -12, 12);

        projectionCtx.save();
        projectionCtx.globalAlpha = target.opacity;
        projectionCtx.translate(target.x, target.y);
        projectionCtx.rotate((tilt + sway) * Math.PI / 180);
        projectionCtx.shadowColor = colors.glow;
        projectionCtx.shadowBlur = size * 0.32;
        if (image) {
          projectionCtx.drawImage(image, -size * 0.5, -size * 0.5, size, size);
        }
        projectionCtx.restore();
      }

      function drawLandingBloom(x, y) {
        drawSoftGlow(x, y, clamp(getButterflyProjectionSize() * 2.4, 120, 220), 0.24, "rgba(195, 235, 215, 1)");
      }

      function addPermanentReveal(x, y) {
        addRevealSpot(x, y, clamp(getButterflyProjectionSize() * 4.8, 190, 360), 0.72);
        permanentGlows.push({
          x,
          y,
          radius: clamp(getButterflyProjectionSize() * 5.2, 220, 390),
          strength: 0.58,
          color: "rgba(255, 230, 170, 1)"
        });
      }

      function revealButterflyPath(target) {
        const distance = Math.hypot(target.x - target.lastX, target.y - target.lastY);
        if (distance < 1.2 || target.opacity <= 0) return;

        revealMaskCtx.save();
        revealMaskCtx.globalCompositeOperation = "source-over";
        revealMaskCtx.strokeStyle = "rgba(255, 255, 255, 0.34)";
        revealMaskCtx.lineWidth = getButterflyProjectionSize() * 0.72;
        revealMaskCtx.lineCap = "round";
        revealMaskCtx.lineJoin = "round";
        revealMaskCtx.shadowColor = "rgba(255, 255, 255, 0.7)";
        revealMaskCtx.shadowBlur = getButterflyProjectionSize() * 0.38;
        revealMaskCtx.beginPath();
        revealMaskCtx.moveTo(target.lastX, target.lastY);
        revealMaskCtx.lineTo(target.x, target.y);
        revealMaskCtx.stroke();
        revealMaskCtx.restore();

        addRevealSpot(target.x, target.y, getButterflyProjectionSize() * 0.9, 0.2);
      }

      function addRevealSpot(x, y, radius, strength) {
        const glow = revealMaskCtx.createRadialGradient(x, y, 0, x, y, radius);
        glow.addColorStop(0, `rgba(255, 255, 255, ${strength})`);
        glow.addColorStop(0.48, `rgba(255, 255, 255, ${strength * 0.48})`);
        glow.addColorStop(1, "rgba(255, 255, 255, 0)");
        revealMaskCtx.save();
        revealMaskCtx.globalCompositeOperation = "source-over";
        revealMaskCtx.fillStyle = glow;
        revealMaskCtx.beginPath();
        revealMaskCtx.arc(x, y, radius, 0, Math.PI * 2);
        revealMaskCtx.fill();
        revealMaskCtx.restore();
      }

      function drawPermanentGlows() {
        permanentGlows.forEach((glow) => {
          drawSoftGlow(glow.x, glow.y, glow.radius, glow.strength, glow.color);
        });
      }

      function drawSoftGlow(x, y, radius, strength, color) {
        projectionCtx.save();
        projectionCtx.globalCompositeOperation = "screen";
        const glow = projectionCtx.createRadialGradient(x, y, 0, x, y, radius);
        glow.addColorStop(0, color.replace("1)", `${strength})`));
        glow.addColorStop(0.42, color.replace("1)", `${strength * 0.42})`));
        glow.addColorStop(1, color.replace("1)", "0)"));
        projectionCtx.fillStyle = glow;
        projectionCtx.beginPath();
        projectionCtx.arc(x, y, radius, 0, Math.PI * 2);
        projectionCtx.fill();
        projectionCtx.restore();
      }

      function drawForestLightFlow(seconds) {
        projectionCtx.save();
        projectionCtx.globalCompositeOperation = "screen";
        projectionCtx.filter = "blur(16px)";

        canopyLightBands.forEach((band) => {
          const travel = ((seconds * band.speed + band.phase) % 1.35) - 0.18;
          const x = PROJECTION_WIDTH * travel;
          const y = PROJECTION_HEIGHT * band.y + Math.sin(seconds * band.float + band.phase * 6) * PROJECTION_HEIGHT * 0.018;
          const w = PROJECTION_WIDTH * band.w;
          const h = PROJECTION_HEIGHT * band.h;
          const glow = projectionCtx.createLinearGradient(x - w, y - h, x + w, y + h);
          glow.addColorStop(0, "rgba(210, 232, 198, 0)");
          glow.addColorStop(0.44, `rgba(210, 232, 198, ${band.alpha})`);
          glow.addColorStop(0.62, `rgba(255, 224, 150, ${band.alpha * 0.38})`);
          glow.addColorStop(1, "rgba(210, 232, 198, 0)");

          projectionCtx.fillStyle = glow;
          projectionCtx.beginPath();
          projectionCtx.ellipse(x, y, w, h, band.angle, 0, Math.PI * 2);
          projectionCtx.fill();
        });

        projectionCtx.filter = "none";
        projectionCtx.restore();
      }

      function drawCabinWarmth(seconds) {
        const pulse = 0.68 + Math.sin(seconds * 0.68) * 0.2 + Math.sin(seconds * 0.27) * 0.1;

        projectionCtx.save();
        projectionCtx.globalCompositeOperation = "screen";
        doorZones.forEach((cabin, index) => {
          const x = forestRect.x + forestRect.w * cabin.x;
          const y = forestRect.y + forestRect.h * cabin.y;
          const rx = forestRect.w * cabin.rx * 1.15 * (0.68 + index * 0.02);
          const ry = forestRect.h * cabin.ry * 0.76;
          const gradient = projectionCtx.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
          gradient.addColorStop(0, `rgba(255, 190, 92, ${0.3 * pulse})`);
          gradient.addColorStop(0.42, `rgba(255, 144, 54, ${0.15 * pulse})`);
          gradient.addColorStop(1, "rgba(255, 144, 54, 0)");
          projectionCtx.fillStyle = gradient;
          projectionCtx.beginPath();
          projectionCtx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
          projectionCtx.fill();
        });
        projectionCtx.restore();
      }

      function drawAtmosphericFog(seconds) {
        projectionCtx.save();
        projectionCtx.globalCompositeOperation = "screen";
        projectionCtx.filter = "blur(18px)";

        fogSheets.forEach((fog) => {
          const x = PROJECTION_WIDTH * (((seconds * fog.speed + fog.phase) % 1.42) - 0.21);
          const y = PROJECTION_HEIGHT * fog.y + Math.sin(seconds * fog.float + fog.phase * 5) * PROJECTION_HEIGHT * 0.018;
          const w = PROJECTION_WIDTH * fog.w;
          const h = PROJECTION_HEIGHT * fog.h;
          const gradient = projectionCtx.createLinearGradient(x - w, y, x + w, y);
          gradient.addColorStop(0, "rgba(190, 215, 210, 0)");
          gradient.addColorStop(0.22, `rgba(190, 215, 210, ${fog.alpha * 0.34})`);
          gradient.addColorStop(0.54, `rgba(198, 222, 216, ${fog.alpha})`);
          gradient.addColorStop(0.82, `rgba(190, 215, 210, ${fog.alpha * 0.28})`);
          gradient.addColorStop(1, "rgba(190, 215, 210, 0)");
          projectionCtx.fillStyle = gradient;
          projectionCtx.beginPath();
          projectionCtx.ellipse(x, y, w, h, fog.angle, 0, Math.PI * 2);
          projectionCtx.fill();
        });

        projectionCtx.filter = "none";
        projectionCtx.restore();
      }

      function drawWaterShimmer(seconds) {
        projectionCtx.save();
        projectionCtx.globalCompositeOperation = "screen";
        projectionCtx.lineCap = "round";
        projectionCtx.filter = "blur(3px)";

        waterStreaks.forEach((line) => {
          const travel = ((seconds * line.speed + line.phase) % 1.25) - 0.15;
          const x = PROJECTION_WIDTH * (0.28 + travel * 0.43);
          const y = PROJECTION_HEIGHT * line.y + Math.sin(seconds * line.float + line.phase * 4) * PROJECTION_HEIGHT * 0.006;
          const alpha = line.alpha * (0.72 + Math.sin(seconds * 0.18 + line.phase * 5) * 0.18);
          const stroke = projectionCtx.createLinearGradient(x - line.length, y, x + line.length, y + line.drop);
          stroke.addColorStop(0, "rgba(205, 236, 226, 0)");
          stroke.addColorStop(0.45, `rgba(205, 236, 226, ${alpha})`);
          stroke.addColorStop(1, "rgba(205, 236, 226, 0)");
          projectionCtx.strokeStyle = stroke;
          projectionCtx.lineWidth = line.width;
          projectionCtx.beginPath();
          projectionCtx.moveTo(x - line.length, y);
          projectionCtx.quadraticCurveTo(
            x,
            y + line.curve + Math.sin(seconds * 0.16 + line.phase) * 4,
            x + line.length,
            y + line.drop
          );
          projectionCtx.stroke();
        });

        projectionCtx.filter = "none";
        projectionCtx.restore();
      }

      function drawProjectorFalloff(seconds) {
        projectionCtx.save();
        projectionCtx.globalCompositeOperation = "multiply";

        const top = projectionCtx.createLinearGradient(0, 0, 0, PROJECTION_HEIGHT * 0.22);
        top.addColorStop(0, "rgba(0, 0, 0, 0.22)");
        top.addColorStop(1, "rgba(255, 255, 255, 1)");
        projectionCtx.fillStyle = top;
        projectionCtx.fillRect(0, 0, PROJECTION_WIDTH, PROJECTION_HEIGHT * 0.22);

        const left = projectionCtx.createLinearGradient(0, 0, PROJECTION_WIDTH * 0.18, 0);
        left.addColorStop(0, "rgba(0, 0, 0, 0.18)");
        left.addColorStop(1, "rgba(255, 255, 255, 1)");
        projectionCtx.fillStyle = left;
        projectionCtx.fillRect(0, 0, PROJECTION_WIDTH * 0.18, PROJECTION_HEIGHT);

        const right = projectionCtx.createLinearGradient(PROJECTION_WIDTH, 0, PROJECTION_WIDTH * 0.82, 0);
        right.addColorStop(0, "rgba(0, 0, 0, 0.18)");
        right.addColorStop(1, "rgba(255, 255, 255, 1)");
        projectionCtx.fillStyle = right;
        projectionCtx.fillRect(PROJECTION_WIDTH * 0.82, 0, PROJECTION_WIDTH * 0.18, PROJECTION_HEIGHT);
        projectionCtx.restore();

        projectionCtx.save();
        projectionCtx.globalCompositeOperation = "screen";
        const projectorBreath = 0.018 + Math.sin(seconds * 0.22) * 0.008 + Math.sin(seconds * 0.071) * 0.006;
        const projectorGlow = projectionCtx.createRadialGradient(
          PROJECTION_WIDTH * (0.52 + Math.sin(seconds * 0.05) * 0.03),
          PROJECTION_HEIGHT * 0.48,
          PROJECTION_WIDTH * 0.08,
          PROJECTION_WIDTH * 0.5,
          PROJECTION_HEIGHT * 0.52,
          PROJECTION_WIDTH * 0.82
        );
        projectorGlow.addColorStop(0, `rgba(220, 232, 214, ${projectorBreath})`);
        projectorGlow.addColorStop(0.58, `rgba(210, 224, 212, ${projectorBreath * 0.45})`);
        projectorGlow.addColorStop(1, "rgba(210, 224, 212, 0)");
        projectionCtx.fillStyle = projectorGlow;
        projectionCtx.fillRect(0, 0, PROJECTION_WIDTH, PROJECTION_HEIGHT);
        projectionCtx.restore();
      }

      function createCanopyLightBands() {
        return [
          { y: 0.18, w: 0.34, h: 0.09, speed: 0.014, float: 0.12, alpha: 0.05, angle: -0.12, phase: 0.04 },
          { y: 0.29, w: 0.42, h: 0.12, speed: 0.01, float: 0.09, alpha: 0.04, angle: 0.08, phase: 0.42 },
          { y: 0.38, w: 0.28, h: 0.08, speed: 0.012, float: 0.11, alpha: 0.035, angle: -0.18, phase: 0.78 },
          { y: 0.47, w: 0.5, h: 0.1, speed: 0.008, float: 0.07, alpha: 0.03, angle: 0.16, phase: 1.1 }
        ];
      }

      function createFogSheets() {
        return [
          { y: 0.24, w: 0.46, h: 0.065, speed: 0.012, float: 0.08, alpha: 0.07, angle: 0.02, phase: 0 },
          { y: 0.34, w: 0.58, h: 0.075, speed: 0.008, float: 0.07, alpha: 0.055, angle: -0.04, phase: 0.32 },
          { y: 0.46, w: 0.5, h: 0.06, speed: 0.01, float: 0.09, alpha: 0.05, angle: 0.05, phase: 0.67 },
          { y: 0.57, w: 0.66, h: 0.085, speed: 0.007, float: 0.06, alpha: 0.06, angle: -0.03, phase: 0.96 },
          { y: 0.66, w: 0.6, h: 0.075, speed: 0.006, float: 0.05, alpha: 0.04, angle: 0.04, phase: 1.2 }
        ];
      }

      function createWaterStreaks() {
        return [
          { y: 0.642, speed: 0.055, phase: 0.05, length: 170, width: 2.4, alpha: 0.105, curve: 8, drop: 8, float: 0.11 },
          { y: 0.676, speed: 0.043, phase: 0.26, length: 230, width: 3.2, alpha: 0.08, curve: 12, drop: 12, float: 0.09 },
          { y: 0.708, speed: 0.038, phase: 0.48, length: 260, width: 4.2, alpha: 0.07, curve: 16, drop: 16, float: 0.08 },
          { y: 0.744, speed: 0.032, phase: 0.7, length: 300, width: 5.4, alpha: 0.055, curve: 20, drop: 22, float: 0.07 },
          { y: 0.79, speed: 0.028, phase: 0.92, length: 340, width: 6.2, alpha: 0.045, curve: 24, drop: 28, float: 0.06 }
        ];
      }

      function getButterflyProjectionSize() {
        return clamp(PROJECTION_WIDTH * 0.043, 64, 92);
      }

      function getCurrentDoor(target) {
        return doorZones.find((door) => {
          const center = getDoorCenter(door);
          const rx = forestRect.w * door.rx;
          const ry = forestRect.h * door.ry;
          const dx = (target.x - center.x) / rx;
          const dy = (target.y - center.y) / ry;
          return dx * dx + dy * dy <= 1;
        });
      }

      function getDoorCenter(door) {
        return {
          x: forestRect.x + forestRect.w * door.x,
          y: forestRect.y + forestRect.h * door.y
        };
      }

      function getRandomLandingPoint() {
        const margin = Math.min(PROJECTION_WIDTH, PROJECTION_HEIGHT) * 0.16;

        return {
          x: margin + Math.random() * Math.max(1, PROJECTION_WIDTH - margin * 2),
          y: margin + Math.random() * Math.max(1, PROJECTION_HEIGHT - margin * 2)
        };
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }

      function getCoverRect(img, containerWidth, containerHeight) {
        const imageRatio = img.naturalWidth / img.naturalHeight;
        const containerRatio = containerWidth / containerHeight;

        if (containerRatio > imageRatio) {
          const w = containerWidth;
          const h = w / imageRatio;
          return { x: 0, y: (containerHeight - h) * 0.5, w, h };
        }

        const h = containerHeight;
        const w = h * imageRatio;
        return { x: (containerWidth - w) * 0.5, y: 0, w, h };
      }

      function getContainRect(img, containerWidth, containerHeight, scale = 1) {
        const imageRatio = img.naturalWidth / img.naturalHeight;
        const containerRatio = containerWidth / containerHeight;
        let w = containerWidth;
        let h = w / imageRatio;

        if (h > containerHeight) {
          h = containerHeight;
          w = h * imageRatio;
        }

        w *= scale;
        h *= scale;
        return {
          x: (containerWidth - w) * 0.5,
          y: (containerHeight - h) * 0.5,
          w,
          h
        };
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function lerpPoint(a, b, t) {
        return {
          x: lerp(a.x, b.x, t),
          y: lerp(a.y, b.y, t)
        };
      }

      function cubicBezier(a, b, c, d, t) {
        const mt = 1 - t;
        return mt * mt * mt * a + 3 * mt * mt * t * b + 3 * mt * t * t * c + t * t * t * d;
      }

      function easeInCubic(t) {
        return t * t * t;
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function easeInOutCubic(t) {
        return t < 0.5
          ? 4 * t * t * t
          : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }
    })();
  </script>
