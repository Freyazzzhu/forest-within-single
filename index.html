<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forest Within</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      --butterfly-size: clamp(24px, 2.75vw, 48px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030303;
      cursor: none;
      touch-action: none;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

      #butterfly {
        position: fixed;
      left: 0;
      top: 0;
      width: var(--butterfly-size);
      height: var(--butterfly-size);
      object-fit: contain;
      pointer-events: none;
        opacity: 0;
        visibility: hidden;
      transform: translate3d(-50%, -50%, 0);
      transform-origin: 50% 50%;
      filter:
        drop-shadow(0 0 4px rgba(255, 236, 170, 0.65))
        drop-shadow(0 0 9px rgba(102, 210, 255, 0.34));
      transition: opacity 420ms ease;
      will-change: transform, opacity;
      z-index: 3;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.74);
      font-size: clamp(15px, 1.4vw, 22px);
      letter-spacing: 0;
      background: #030303;
      z-index: 4;
      transition: opacity 300ms ease, visibility 300ms ease;
    }

    #loading.is-hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Immersive projection gallery with interactive forest colour reveal"></canvas>
  <img id="butterfly" src="assets/thinking-of-someone-butterfly.svg" alt="Blue butterfly">
  <div id="loading">Loading forest...</div>

  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/embedded-assets.js"></script>
  <script>
    (() => {
      const canvas = document.getElementById("scene");
      const loadingEl = document.getElementById("loading");

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        powerPreference: "high-performance"
      });
      renderer.setClearColor(0x030303, 1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      if ("outputColorSpace" in renderer && "SRGBColorSpace" in THREE) {
        renderer.outputColorSpace = THREE.SRGBColorSpace;
      } else {
        renderer.outputEncoding = THREE.sRGBEncoding;
      }
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.82;

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x030303, 7.5, 18);

      const camera = new THREE.PerspectiveCamera(58, 1, 0.05, 60);
      camera.position.set(0, 1.6, 4.35);

      const galleryRig = new THREE.Group();
      scene.add(galleryRig);

      const projectionCanvas = document.createElement("canvas");
      const projectionCtx = projectionCanvas.getContext("2d", { alpha: false });
      const maskCanvas = document.createElement("canvas");
      const maskCtx = maskCanvas.getContext("2d");
      const permanentMaskCanvas = document.createElement("canvas");
      const permanentMaskCtx = permanentMaskCanvas.getContext("2d");
      const colorCanvas = document.createElement("canvas");
      const colorCtx = colorCanvas.getContext("2d");

      const projectionTexture = new THREE.CanvasTexture(projectionCanvas);
      if ("colorSpace" in projectionTexture && "SRGBColorSpace" in THREE) {
        projectionTexture.colorSpace = THREE.SRGBColorSpace;
      } else {
        projectionTexture.encoding = THREE.sRGBEncoding;
      }
      projectionTexture.wrapS = THREE.ClampToEdgeWrapping;
      projectionTexture.wrapT = THREE.ClampToEdgeWrapping;
      projectionTexture.minFilter = THREE.LinearFilter;
      projectionTexture.magFilter = THREE.LinearFilter;

      const WALL_RADIUS = 5.25;
      const WALL_ARC_START = THREE.MathUtils.degToRad(-100);
      const WALL_ARC_LENGTH = THREE.MathUtils.degToRad(200);
      const WALL_Z_OFFSET = 0.2;
      const WALL_X_SCALE = 0.94;

      const raycaster = new THREE.Raycaster();
      const pointerNdc = new THREE.Vector2();
      const images = {};

      const pointer = {
        x: 1024,
        y: 576,
        active: false
      };

      const butterfly = {
        x: pointer.x,
        y: pointer.y,
        lastX: pointer.x,
        lastY: pointer.y,
        angle: 0,
        opacity: 1,
        scale: 1
      };

      const look = {
        targetYaw: 0,
        targetPitch: 0,
        yaw: 0,
        pitch: 0,
        dragging: false,
        lastX: 0,
        lastY: 0
      };
      const viewer = {
        x: 0,
        z: 4.35,
        targetX: 0,
        targetZ: 4.35
      };

      const particles = [];
      const doorZones = [
        { x: 0.205, y: 0.555, rx: 0.105, ry: 0.18 },
        { x: 0.432, y: 0.555, rx: 0.095, ry: 0.17 },
        { x: 0.787, y: 0.555, rx: 0.1, ry: 0.18 }
      ];

      let mode = "follow";
      let hoverDoor = null;
      let hoverSeconds = 0;
      let flight = null;
      let width = 0;
      let height = 0;
      let dpr = 1;
      let projectionWidth = 0;
      let projectionHeight = 0;
      let coverRect = { x: 0, y: 0, w: 0, h: 0 };
      let projectionWall = null;
      let previousTime = performance.now();
      const pressedKeys = new Set();

      Promise.all([
        loadImage(window.FOREST_WITHIN_EMBEDDED_ASSETS.bg),
        loadImage(window.FOREST_WITHIN_EMBEDDED_ASSETS.color),
        loadImage(window.FOREST_WITHIN_EMBEDDED_ASSETS.butterfly)
      ]).then(([bg, color, butterflyImage]) => {
        images.bg = bg;
        images.color = color;
        images.butterfly = butterflyImage;

        buildGallery();
        resize();
        loadingEl.classList.add("is-hidden");
        butterfly.opacity = 1;
        requestAnimationFrame(render);
      });

      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", updatePointer, { passive: true });
      window.addEventListener("pointerdown", startPointer, { passive: true });
      window.addEventListener("pointerup", stopPointer, { passive: true });
      window.addEventListener("pointercancel", stopPointer, { passive: true });
      window.addEventListener("touchmove", updateTouch, { passive: false });
      window.addEventListener("touchstart", updateTouch, { passive: false });
      window.addEventListener("keydown", handleKeyDown);
      window.addEventListener("keyup", handleKeyUp);
      window.addEventListener("blur", () => pressedKeys.clear());

      function buildGallery() {
        scene.add(new THREE.HemisphereLight(0x202026, 0x050505, 0.38));

        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(15, 13),
          new THREE.MeshStandardMaterial({
            color: 0x080808,
            roughness: 0.72,
            metalness: 0.08
          })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, 0, -1.5);
        floor.receiveShadow = true;
        galleryRig.add(floor);

        const ceiling = new THREE.Mesh(
          new THREE.PlaneGeometry(15, 13),
          new THREE.MeshStandardMaterial({
            color: 0x020202,
            roughness: 0.9
          })
        );
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.set(0, 3.6, -1.5);
        galleryRig.add(ceiling);

        const backWall = new THREE.Mesh(
          new THREE.PlaneGeometry(15, 3.6),
          new THREE.MeshStandardMaterial({ color: 0x020202, roughness: 0.88 })
        );
        backWall.position.set(0, 1.8, 5.05);
        galleryRig.add(backWall);

        const sideMaterial = new THREE.MeshStandardMaterial({ color: 0x030303, roughness: 0.86 });
        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 3.6), sideMaterial);
        leftWall.position.set(-7.5, 1.8, 0.35);
        leftWall.rotation.y = Math.PI / 2;
        galleryRig.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 3.6), sideMaterial);
        rightWall.position.set(7.5, 1.8, 0.35);
        rightWall.rotation.y = -Math.PI / 2;
        galleryRig.add(rightWall);

        const floorSpill = new THREE.Mesh(
          new THREE.PlaneGeometry(8.6, 2.25),
          new THREE.MeshBasicMaterial({
            map: projectionTexture,
            transparent: true,
            opacity: 0.14,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          })
        );
        floorSpill.rotation.x = -Math.PI / 2;
        floorSpill.position.set(0, 0.018, -1.85);
        galleryRig.add(floorSpill);

        const wallGeometry = createCurvedWallGeometry(WALL_RADIUS, 3.05, 128);
        const projectionMaterial = new THREE.MeshBasicMaterial({
          map: projectionTexture,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.96
        });
        projectionWall = new THREE.Mesh(wallGeometry, projectionMaterial);
        projectionWall.position.set(0, 0.22, 0);
        galleryRig.add(projectionWall);

        const glowWall = new THREE.Mesh(
          createCurvedWallGeometry(WALL_RADIUS - 0.03, 3.12, 128),
          new THREE.MeshBasicMaterial({
            map: projectionTexture,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.12,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          })
        );
        glowWall.position.copy(projectionWall.position);
        galleryRig.add(glowWall);

        addPanelLines();
        addStandingCircle();
        addProjectors();
        addTrackLights();
        addMinimalBenches();
      }

      function createCurvedWallGeometry(radius, wallHeight, segments) {
        const positions = [];
        const uvs = [];
        const indices = [];

        for (let i = 0; i <= segments; i += 1) {
          const u = i / segments;
          const angle = WALL_ARC_START + WALL_ARC_LENGTH * u;
          const x = Math.sin(angle) * radius * WALL_X_SCALE;
          const z = -Math.cos(angle) * radius + WALL_Z_OFFSET;

          positions.push(x, 0, z, x, wallHeight, z);
          uvs.push(u, 0, u, 1);
        }

        for (let i = 0; i < segments; i += 1) {
          const a = i * 2;
          const b = a + 1;
          const c = a + 2;
          const d = a + 3;
          indices.push(a, c, b, c, d, b);
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
      }

      function addPanelLines() {
        const material = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.13
        });
        const radius = WALL_RADIUS - 0.01;
        const arcStart = WALL_ARC_START;
        const arcLength = WALL_ARC_LENGTH;
        for (let i = 1; i < 7; i += 1) {
          const angle = arcStart + arcLength * (i / 7);
          const x = Math.sin(angle) * radius * WALL_X_SCALE;
          const z = -Math.cos(angle) * radius + WALL_Z_OFFSET;
          const points = [
            new THREE.Vector3(x, 0.28, z),
            new THREE.Vector3(x, 3.18, z)
          ];
          const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material);
          galleryRig.add(line);
        }
      }

      function addStandingCircle() {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.5, 0.56, 96),
          new THREE.MeshBasicMaterial({
            color: 0xcfd6d5,
            transparent: true,
            opacity: 0.58,
            side: THREE.DoubleSide
          })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(0, 0.03, 2.05);
        ring.renderOrder = 2;
        galleryRig.add(ring);
      }

      function addProjectors() {
        const projectorMaterial = new THREE.MeshStandardMaterial({
          color: 0x111111,
          roughness: 0.48,
          metalness: 0.45
        });
        const lensMaterial = new THREE.MeshBasicMaterial({
          color: 0xcfeaff,
          transparent: true,
          opacity: 0.72
        });
        const positions = [-2.9, 0, 2.9];
        positions.forEach((x, index) => {
          const projector = new THREE.Group();
          const body = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.22, 0.42), projectorMaterial);
          body.castShadow = true;
          const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.06, 24), lensMaterial);
          lens.rotation.x = Math.PI / 2;
          lens.position.z = -0.24;
          const mount = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.42, 12), projectorMaterial);
          mount.position.y = 0.28;
          projector.add(body, lens, mount);
          projector.position.set(x, 3.05, 1.62 - Math.abs(index - 1) * 0.18);
          projector.rotation.y = x * 0.06;
          galleryRig.add(projector);
        });
      }

      function addTrackLights() {
        const railMaterial = new THREE.MeshStandardMaterial({ color: 0x090909, roughness: 0.55, metalness: 0.32 });
        const rail = new THREE.Mesh(new THREE.BoxGeometry(6.3, 0.04, 0.04), railMaterial);
        rail.position.set(0, 3.22, 1.08);
        galleryRig.add(rail);

        [-2.7, -1.35, 1.35, 2.7].forEach((x) => {
          const lightBody = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 0.24, 20), railMaterial);
          lightBody.position.set(x, 3.06, 1.08);
          lightBody.rotation.x = Math.PI / 2.8;
          lightBody.castShadow = true;
          galleryRig.add(lightBody);

          const spot = new THREE.SpotLight(0xe8f2ff, 0.82, 7.5, Math.PI / 6, 0.72, 1.7);
          spot.position.set(x, 3, 0.92);
          spot.target.position.set(x * 0.55, 0.02, -1.4);
          spot.castShadow = true;
          spot.shadow.mapSize.set(512, 512);
          galleryRig.add(spot, spot.target);
        });
      }

      function addMinimalBenches() {
        const material = new THREE.MeshStandardMaterial({
          color: 0x050505,
          roughness: 0.68,
          metalness: 0.18
        });
        [-4.2, 4.2].forEach((x) => {
          const bench = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.28, 0.42), material);
          bench.position.set(x, 0.32, 2.65);
          bench.castShadow = true;
          bench.receiveShadow = true;
          galleryRig.add(bench);
        });
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }

      function resize() {
        if (!images.bg) return;

        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        projectionWidth = 2048;
        projectionHeight = 1152;

        renderer.setPixelRatio(dpr);
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        for (const target of [projectionCanvas, maskCanvas, permanentMaskCanvas, colorCanvas]) {
          target.width = projectionWidth;
          target.height = projectionHeight;
        }

        for (const context of [projectionCtx, maskCtx, permanentMaskCtx, colorCtx]) {
          context.setTransform(1, 0, 0, 1, 0, 0);
          context.imageSmoothingEnabled = true;
          context.imageSmoothingQuality = "high";
        }

        coverRect = getCoverRect(images.bg, projectionWidth, projectionHeight);

        if (!pointer.active) {
          pointer.x = projectionWidth * 0.5;
          pointer.y = projectionHeight * 0.5;
          butterfly.x = pointer.x;
          butterfly.y = pointer.y;
          butterfly.lastX = pointer.x;
          butterfly.lastY = pointer.y;
        }
      }

      function startPointer(event) {
        look.dragging = true;
        look.lastX = event.clientX;
        look.lastY = event.clientY;
        updatePointer(event);
      }

      function stopPointer() {
        look.dragging = false;
      }

      function updatePointer(event) {
        updateProjectionPointer(event.clientX, event.clientY);
        pointer.active = true;

        if (!look.dragging) return;
        const dx = event.clientX - look.lastX;
        const dy = event.clientY - look.lastY;
        look.lastX = event.clientX;
        look.lastY = event.clientY;
        look.targetYaw = clamp(look.targetYaw - dx * 0.0018, -0.34, 0.34);
        look.targetPitch = clamp(look.targetPitch - dy * 0.0013, -0.13, 0.13);
      }

      function updateTouch(event) {
        event.preventDefault();
        if (!event.touches.length) return;

        const touch = event.touches[0];
        updateProjectionPointer(touch.clientX, touch.clientY);
        pointer.active = true;

        if (event.touches.length === 1 && look.dragging) {
          const dx = touch.clientX - look.lastX;
          const dy = touch.clientY - look.lastY;
          look.lastX = touch.clientX;
          look.lastY = touch.clientY;
          look.targetYaw = clamp(look.targetYaw - dx * 0.0018, -0.34, 0.34);
          look.targetPitch = clamp(look.targetPitch - dy * 0.0013, -0.13, 0.13);
        } else {
          look.dragging = true;
          look.lastX = touch.clientX;
          look.lastY = touch.clientY;
        }
      }

      function updateProjectionPointer(clientX, clientY) {
        const hit = getProjectionHit(clientX, clientY);
        pointer.x = hit.x;
        pointer.y = hit.y;
      }

      function getProjectionHit(clientX, clientY) {
        if (projectionWall) {
          pointerNdc.set(
            (clientX / Math.max(1, width)) * 2 - 1,
            -(clientY / Math.max(1, height)) * 2 + 1
          );
          raycaster.setFromCamera(pointerNdc, camera);
          const [hit] = raycaster.intersectObject(projectionWall, false);

          if (hit?.uv) {
            return {
              x: clamp(hit.uv.x * projectionWidth, 0, projectionWidth),
              y: clamp((1 - hit.uv.y) * projectionHeight, 0, projectionHeight)
            };
          }
        }

        return {
          x: clamp((clientX / Math.max(1, width)) * projectionWidth, 0, projectionWidth),
          y: clamp((clientY / Math.max(1, height)) * projectionHeight, 0, projectionHeight)
        };
      }

      function handleKeyDown(event) {
        const key = getControlKey(event);
        if (!key) return;
        nudgeViewer(key);
        pressedKeys.add(key);
        event.preventDefault();
      }

      function handleKeyUp(event) {
        const key = getControlKey(event);
        if (!key) return;
        pressedKeys.delete(key);
        event.preventDefault();
      }

      function getControlKey(event) {
        if (event.key === "ArrowUp") return "ArrowUp";
        if (event.key === "ArrowDown") return "ArrowDown";
        if (event.key === "ArrowLeft") return "ArrowLeft";
        if (event.key === "ArrowRight") return "ArrowRight";
        return "";
      }

      function render(time) {
        const dt = Math.min((time - previousTime) / 1000, 0.05);
        previousTime = time;

        moveButterfly(dt);
        updateTemporaryReveal(dt);
        drawForest();
        drawParticles(dt);
        drawButterflyOnProjection();
        updateCamera(dt);

        projectionTexture.needsUpdate = true;
        renderer.render(scene, camera);
        requestAnimationFrame(render);
      }

      function updateCamera(dt) {
        updateViewerPosition(dt);
        const ease = 1 - Math.exp(-dt * 6);
        look.yaw += (look.targetYaw - look.yaw) * ease;
        look.pitch += (look.targetPitch - look.pitch) * ease;
        viewer.x += (viewer.targetX - viewer.x) * ease;
        viewer.z += (viewer.targetZ - viewer.z) * ease;
        camera.position.x = viewer.x;
        camera.position.z = viewer.z;
        camera.rotation.set(look.pitch, look.yaw, 0, "YXZ");
      }

      function updateViewerPosition(dt) {
        let forward = 0;
        let sideways = 0;
        if (pressedKeys.has("ArrowUp")) forward += 1;
        if (pressedKeys.has("ArrowDown")) forward -= 1;
        if (pressedKeys.has("ArrowLeft")) sideways -= 1;
        if (pressedKeys.has("ArrowRight")) sideways += 1;
        if (!forward && !sideways) return;

        const length = Math.hypot(forward, sideways);
        const speed = 2.2;
        const yaw = look.yaw;
        const forwardX = -Math.sin(yaw);
        const forwardZ = -Math.cos(yaw);
        const rightX = Math.cos(yaw);
        const rightZ = -Math.sin(yaw);

        viewer.targetX += ((forwardX * forward + rightX * sideways) / length) * speed * dt;
        viewer.targetZ += ((forwardZ * forward + rightZ * sideways) / length) * speed * dt;
        clampViewerTarget();
      }

      function nudgeViewer(key) {
        const step = 0.24;
        const yaw = look.yaw;
        const forwardX = -Math.sin(yaw);
        const forwardZ = -Math.cos(yaw);
        const rightX = Math.cos(yaw);
        const rightZ = -Math.sin(yaw);

        if (key === "ArrowUp") {
          viewer.targetX += forwardX * step;
          viewer.targetZ += forwardZ * step;
        }
        if (key === "ArrowDown") {
          viewer.targetX -= forwardX * step;
          viewer.targetZ -= forwardZ * step;
        }
        if (key === "ArrowLeft") {
          viewer.targetX -= rightX * step;
          viewer.targetZ -= rightZ * step;
        }
        if (key === "ArrowRight") {
          viewer.targetX += rightX * step;
          viewer.targetZ += rightZ * step;
        }

        clampViewerTarget();
      }

      function clampViewerTarget() {
        viewer.targetX = clamp(viewer.targetX, -1.55, 1.55);
        viewer.targetZ = clamp(viewer.targetZ, 1.45, 5.15);
      }

      function moveButterfly(dt) {
        butterfly.lastX = butterfly.x;
        butterfly.lastY = butterfly.y;

        if (mode !== "follow") {
          updateFlight(dt);
          updateButterflyAngle();
          return;
        }

        const follow = 1 - Math.exp(-dt * 8.5);
        butterfly.x += (pointer.x - butterfly.x) * follow;
        butterfly.y += (pointer.y - butterfly.y) * follow;

        butterfly.opacity = 1;
        butterfly.scale = 1;
        updateDoorHover(dt);
        updateButterflyAngle();
      }

      function updateButterflyAngle() {
        const dx = butterfly.x - butterfly.lastX;
        const dy = butterfly.y - butterfly.lastY;
        if (Math.hypot(dx, dy) > 0.2) {
          butterfly.angle = Math.atan2(dy, dx) * 180 / Math.PI;
        }
      }

      function updateDoorHover(dt) {
        const door = getCurrentDoor();

        if (!door) {
          hoverDoor = null;
          hoverSeconds = 0;
          return;
        }

        if (door !== hoverDoor) {
          hoverDoor = door;
          hoverSeconds = 0;
        }

        hoverSeconds += dt;
        if (hoverSeconds >= 5) {
          beginEnteringCabin(door);
        }
      }

      function updateFlight(dt) {
        if (!flight) return;

        flight.elapsed += dt;
        const t = clamp(flight.elapsed / flight.duration, 0, 1);
        const eased = easeInOutCubic(t);

        butterfly.x = cubicBezier(
          flight.from.x,
          flight.controlA.x,
          flight.controlB.x,
          flight.to.x,
          eased
        );
        butterfly.y = cubicBezier(
          flight.from.y,
          flight.controlA.y,
          flight.controlB.y,
          flight.to.y,
          eased
        );
        butterfly.opacity = lerp(flight.fromOpacity, flight.toOpacity, flight.opacityEase(t));
        butterfly.scale = lerp(flight.fromScale, flight.toScale, flight.scaleEase(t));

        if (mode === "autoFlying" && t > 0.7) {
          drawLandingBloom(flight.to.x, flight.to.y);
        }

        if (t < 1) return;

        if (mode === "entering") {
          beginInsideWait(flight.door);
          return;
        }

        if (mode === "autoFlying") {
          beginVanishing(flight.to);
          return;
        }

        if (mode === "vanishing") {
          mode = "hidden";
          flight = null;
        }
      }

      function beginEnteringCabin(door) {
        const target = getDoorCenter(door);
        mode = "entering";
        hoverDoor = null;
        hoverSeconds = 0;
        flight = {
          door,
          elapsed: 0,
          duration: 1.45,
          from: { x: butterfly.x, y: butterfly.y },
          controlA: { x: butterfly.x, y: butterfly.y - projectionHeight * 0.048 },
          controlB: { x: target.x, y: target.y - projectionHeight * 0.03 },
          to: target,
          fromOpacity: butterfly.opacity,
          toOpacity: 0,
          fromScale: butterfly.scale,
          toScale: 0.12,
          opacityEase: easeInCubic,
          scaleEase: easeInCubic
        };
      }

      function beginInsideWait(door) {
        mode = "inside";
        flight = null;
        window.setTimeout(() => {
          if (mode === "inside") {
            beginAutoFlight(door);
          }
        }, 10000);
      }

      function beginAutoFlight(door) {
        const start = getDoorCenter(door);
        const destination = getRandomLandingPoint();

        butterfly.x = start.x;
        butterfly.y = start.y;
        butterfly.lastX = start.x;
        butterfly.lastY = start.y;
        mode = "autoFlying";
        flight = {
          elapsed: 0,
          duration: 4.2,
          from: start,
          controlA: {
            x: lerp(start.x, destination.x, 0.28),
            y: Math.min(start.y, destination.y) - projectionHeight * 0.24
          },
          controlB: {
            x: lerp(start.x, destination.x, 0.72),
            y: Math.min(start.y, destination.y) - projectionHeight * 0.18
          },
          to: destination,
          fromOpacity: 0,
          toOpacity: 1,
          fromScale: 0.18,
          toScale: 1,
          opacityEase: easeOutCubic,
          scaleEase: easeOutCubic
        };
      }

      function beginVanishing(point) {
        drawPermanentColorPatch(point.x, point.y);
        mode = "vanishing";
        flight = {
          elapsed: 0,
          duration: 3.2,
          from: { x: butterfly.x, y: butterfly.y },
          controlA: { x: butterfly.x + projectionWidth * 0.05, y: butterfly.y - projectionHeight * 0.08 },
          controlB: { x: butterfly.x - projectionWidth * 0.02, y: butterfly.y - projectionHeight * 0.13 },
          to: { x: butterfly.x, y: butterfly.y - projectionHeight * 0.18 },
          fromOpacity: 1,
          toOpacity: 0,
          fromScale: 1,
          toScale: 0.35,
          opacityEase: easeInCubic,
          scaleEase: easeInCubic
        };
      }

      function updateTemporaryReveal(dt) {
        maskCtx.save();
        maskCtx.globalCompositeOperation = "destination-out";
        maskCtx.fillStyle = `rgba(0, 0, 0, ${1 - Math.exp(-dt / 0.32)})`;
        maskCtx.fillRect(0, 0, projectionWidth, projectionHeight);
        maskCtx.restore();

        if (mode === "inside" || mode === "hidden") {
          return;
        }

        const current = { x: butterfly.x, y: butterfly.y };
        const last = { x: butterfly.lastX, y: butterfly.lastY };
        const distance = Math.hypot(current.x - last.x, current.y - last.y);
        const steps = Math.max(1, Math.ceil(distance / 18));
        for (let i = 0; i <= steps; i += 1) {
          const t = i / steps;
          const x = lerp(last.x, current.x, t);
          const y = lerp(last.y, current.y, t);
          drawBrush(x, y);
        }

        if (distance > 0.35) {
          emitParticles(distance, current, last);
        }
      }

      function drawBrush(x, y) {
        const radius = clamp(Math.min(projectionWidth, projectionHeight) * 0.092, 78, 172);
        drawSoftMask(maskCtx, x, y, radius, 1);
      }

      function drawLandingBloom(x, y) {
        const radius = clamp(Math.min(projectionWidth, projectionHeight) * 0.11, 86, 180);
        drawSoftMask(maskCtx, x, y, radius, 0.72);
      }

      function drawPermanentColorPatch(x, y) {
        const radius = clamp(getButterflyProjectionSize() * 5.4, 180, 380);
        drawSoftMask(permanentMaskCtx, x, y, radius, 1);
      }

      function drawSoftMask(targetCtx, x, y, radius, strength) {
        const inner = radius * 0.18;
        const gradient = targetCtx.createRadialGradient(x, y, inner, x, y, radius);

        gradient.addColorStop(0, `rgba(255, 255, 255, ${strength})`);
        gradient.addColorStop(0.35, `rgba(255, 255, 255, ${strength * 0.6})`);
        gradient.addColorStop(0.72, `rgba(255, 255, 255, ${strength * 0.2})`);
        gradient.addColorStop(1, "rgba(255, 255, 255, 0)");

        targetCtx.save();
        targetCtx.globalCompositeOperation = "source-over";
        targetCtx.fillStyle = gradient;
        targetCtx.beginPath();
        targetCtx.arc(x, y, radius, 0, Math.PI * 2);
        targetCtx.fill();
        targetCtx.restore();
      }

      function drawForest() {
        projectionCtx.clearRect(0, 0, projectionWidth, projectionHeight);
        projectionCtx.drawImage(images.bg, coverRect.x, coverRect.y, coverRect.w, coverRect.h);

        drawColorLayer(maskCanvas);
        drawColorLayer(permanentMaskCanvas, true);
        drawProjectionFalloff();
      }

      function drawProjectionFalloff() {
        projectionCtx.save();
        projectionCtx.globalCompositeOperation = "multiply";
        const top = projectionCtx.createLinearGradient(0, 0, 0, projectionHeight * 0.24);
        top.addColorStop(0, "rgba(0, 0, 0, 0.38)");
        top.addColorStop(1, "rgba(255, 255, 255, 1)");
        projectionCtx.fillStyle = top;
        projectionCtx.fillRect(0, 0, projectionWidth, projectionHeight * 0.24);

        const bottom = projectionCtx.createLinearGradient(0, projectionHeight, 0, projectionHeight * 0.72);
        bottom.addColorStop(0, "rgba(0, 0, 0, 0.34)");
        bottom.addColorStop(1, "rgba(255, 255, 255, 1)");
        projectionCtx.fillStyle = bottom;
        projectionCtx.fillRect(0, projectionHeight * 0.72, projectionWidth, projectionHeight * 0.28);
        projectionCtx.restore();

        projectionCtx.save();
        projectionCtx.globalCompositeOperation = "screen";
        const centerGlow = projectionCtx.createRadialGradient(
          projectionWidth * 0.5,
          projectionHeight * 0.48,
          projectionWidth * 0.08,
          projectionWidth * 0.5,
          projectionHeight * 0.48,
          projectionWidth * 0.7
        );
        centerGlow.addColorStop(0, "rgba(255, 255, 255, 0.06)");
        centerGlow.addColorStop(1, "rgba(255, 255, 255, 0)");
        projectionCtx.fillStyle = centerGlow;
        projectionCtx.fillRect(0, 0, projectionWidth, projectionHeight);
        projectionCtx.restore();
      }

      function drawColorLayer(sourceMask, boosted = false) {
        colorCtx.clearRect(0, 0, projectionWidth, projectionHeight);
        colorCtx.filter = boosted
          ? "saturate(2.25) contrast(1.42) brightness(1.06)"
          : "saturate(1.95) contrast(1.24) brightness(1.03)";
        colorCtx.drawImage(images.color, coverRect.x, coverRect.y, coverRect.w, coverRect.h);
        colorCtx.filter = "none";
        colorCtx.globalCompositeOperation = "destination-in";
        colorCtx.drawImage(sourceMask, 0, 0, projectionWidth, projectionHeight);
        colorCtx.globalCompositeOperation = "source-over";
        projectionCtx.drawImage(colorCanvas, 0, 0, projectionWidth, projectionHeight);

        if (boosted) {
          projectionCtx.save();
          projectionCtx.globalAlpha = 0.22;
          projectionCtx.globalCompositeOperation = "screen";
          projectionCtx.drawImage(colorCanvas, 0, 0, projectionWidth, projectionHeight);
          projectionCtx.restore();
        }
      }

      function emitParticles(distance, current, last) {
        if (mode === "inside" || mode === "hidden") return;

        const count = clamp(Math.round(distance / 24), 1, 5);
        const direction = Math.atan2(current.y - last.y, current.x - last.x) + Math.PI;

        for (let i = 0; i < count; i += 1) {
          const spread = (Math.random() - 0.5) * 1.15;
          const speed = 42 + Math.random() * 120;
          const size = 1.3 + Math.random() * 2.4;

          particles.push({
            x: current.x + (Math.random() - 0.5) * 11,
            y: current.y + (Math.random() - 0.5) * 11,
            vx: Math.cos(direction + spread) * speed,
            vy: Math.sin(direction + spread) * speed - 11,
            life: 0.45 + Math.random() * 0.4,
            maxLife: 0.45 + Math.random() * 0.4,
            size
          });
        }

        if (particles.length > 180) {
          particles.splice(0, particles.length - 180);
        }
      }

      function drawParticles(dt) {
        projectionCtx.save();
        projectionCtx.globalCompositeOperation = "lighter";

        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const particle = particles[i];
          particle.life -= dt;

          if (particle.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= Math.pow(0.86, dt * 60);
          particle.vy *= Math.pow(0.86, dt * 60);

          const alpha = Math.pow(particle.life / particle.maxLife, 1.6);
          const glow = projectionCtx.createRadialGradient(
            particle.x,
            particle.y,
            0,
            particle.x,
            particle.y,
            particle.size * 4
          );

          glow.addColorStop(0, `rgba(255, 245, 186, ${0.46 * alpha})`);
          glow.addColorStop(0.48, `rgba(112, 218, 255, ${0.24 * alpha})`);
          glow.addColorStop(1, "rgba(112, 218, 255, 0)");

          projectionCtx.fillStyle = glow;
          projectionCtx.beginPath();
          projectionCtx.arc(particle.x, particle.y, particle.size * 4, 0, Math.PI * 2);
          projectionCtx.fill();
        }

        projectionCtx.restore();
      }

      function drawButterflyOnProjection() {
        if (!images.butterfly || butterfly.opacity <= 0) return;

        const size = getButterflyProjectionSize() * butterfly.scale;
        const sway = Math.sin(performance.now() * 0.006) * 5;
        const tilt = clamp(butterfly.angle * 0.08, -12, 12);

        projectionCtx.save();
        projectionCtx.globalAlpha = butterfly.opacity;
        projectionCtx.shadowColor = "rgba(102, 210, 255, 0.45)";
        projectionCtx.shadowBlur = size * 0.24;
        projectionCtx.translate(butterfly.x, butterfly.y);
        projectionCtx.rotate((tilt + sway) * Math.PI / 180);
        projectionCtx.drawImage(images.butterfly, -size * 0.5, -size * 0.5, size, size);
        projectionCtx.restore();
      }

      function getButterflyProjectionSize() {
        return clamp(projectionWidth * 0.034, 48, 78);
      }

      function getCurrentDoor() {
        return doorZones.find((door) => {
          const center = getDoorCenter(door);
          const rx = door.rx * coverRect.w;
          const ry = door.ry * coverRect.h;
          const dx = (butterfly.x - center.x) / rx;
          const dy = (butterfly.y - center.y) / ry;

          return dx * dx + dy * dy <= 1;
        });
      }

      function getDoorCenter(door) {
        return {
          x: coverRect.x + door.x * coverRect.w,
          y: coverRect.y + door.y * coverRect.h
        };
      }

      function getRandomLandingPoint() {
        const margin = Math.min(projectionWidth, projectionHeight) * 0.16;

        return {
          x: margin + Math.random() * Math.max(1, projectionWidth - margin * 2),
          y: margin + Math.random() * Math.max(1, projectionHeight - margin * 2)
        };
      }

      function getCoverRect(img, containerWidth, containerHeight) {
        const imageRatio = img.naturalWidth / img.naturalHeight;
        const containerRatio = containerWidth / containerHeight;

        if (containerRatio > imageRatio) {
          const w = containerWidth;
          const h = w / imageRatio;
          return { x: 0, y: (containerHeight - h) * 0.5, w, h };
        }

        const h = containerHeight;
        const w = h * imageRatio;
        return { x: (containerWidth - w) * 0.5, y: 0, w, h };
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function cubicBezier(a, b, c, d, t) {
        const mt = 1 - t;
        return mt * mt * mt * a + 3 * mt * mt * t * b + 3 * mt * t * t * c + t * t * t * d;
      }

      function easeInCubic(t) {
        return t * t * t;
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function easeInOutCubic(t) {
        return t < 0.5
          ? 4 * t * t * t
          : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }
    })();
  </script>
</body>
